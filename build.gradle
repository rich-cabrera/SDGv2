plugins {
    id 'java'
}

group 'com.pahlsoft.examples.simpledata'

// Use release flag for cross-compilation compatibility
tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

//create a single Jar with all dependencies
tasks.register('fatJar', Jar) {
    manifest {
        attributes 'Implementation-Title': 'Simple Load Generator',
                'Implementation-Version': 1.0,
                'Main-Class': 'com.pahlsoft.simpledata.runner.EngineRunner'
    }
    archiveBaseName = project.name
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    implementation 'org.elasticsearch.client:elasticsearch-rest-high-level-client:7.17.9'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'
    implementation 'ch.qos.logback:logback-core:1.4.14'
    implementation 'com.github.javafaker:javafaker:1.0.2'
    implementation 'co.elastic.apm:apm-agent-api:1.44.0'
    // Log4j2 to SLF4J bridge (for Elasticsearch client compatibility)
    implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.22.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.22.1'
}

tasks.named('clean') {
    delete 'out', 'build', 'transaction-engine.log'
}