# Proxy Log Generator - ProxySG/Bluecoat style logs
# Configure connection settings for your Elastic Cloud deployment
elasticsearchScheme: https
elasticsearchHost: 38b9249405d44e4fbe37122c0da005ed.us-east-1.aws.found.io
elasticsearchPort: 443
elasticsearchUser: admin
elasticsearchPassword: admin1
workloads:
  # Normal proxy traffic
  - workloadName: bluecoat-proxy
    workloadThreads: 6
    workloadSleep: 100
    indexName: proxy
    fields:
      - name: proxcode
        type: int
        range: 1,82

      - name: ripcodes
        type: int
        range: 1,220

      - name: rip2
        type: int
        range: 0,255

      - name: rip3
        type: int
        range: 0,255

      - name: rip4
        type: int
        range: 0,255

      - name: 2rip1
        type: int
        range: 10,10

      - name: 2rip2
        type: int
        range: 30,50

      - name: 2rip3
        type: int
        range: 100,200

      - name: 2rip4
        type: int
        range: 0,254

      - name: proxyrequestbytes
        type: int
        range: 0,9229

      - name: proxyresponsebytes
        type: int
        range: 0,622996

      - name: proxyrequesturl
        type: url

      - name: uacode
        type: int
        range: 1,1035

  # Malicious/suspicious proxy traffic
  - workloadName: bluecoat-proxy-malware
    workloadThreads: 1
    workloadSleep: 10000
    indexName: proxy
    fields:
      - name: proxcode
        type: int
        range: 69,87

      - name: ripcodes
        type: int
        range: 1,220

      - name: rip2
        type: int
        range: 0,255

      - name: rip3
        type: int
        range: 0,255

      - name: rip4
        type: int
        range: 0,255

      - name: 2rip1
        type: int
        range: 10,10

      - name: 2rip2
        type: int
        range: 30,50

      - name: 2rip3
        type: int
        range: 100,200

      - name: 2rip4
        type: int
        range: 0,254

      - name: proxyrequestbytes
        type: int
        range: 0,32761

      - name: proxyresponsebytes
        type: int
        range: 0,622996

      - name: proxyrequesturl
        type: url

      - name: uacode
        type: int
        range: 1,1035
